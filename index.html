<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP IPTV Pro - VLC Hybrid Power Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #070709; color: #f1f5f9; overflow: hidden; }
        
        /* ভিডিও প্লেয়ার সেকশন */
        #main-player { width: 100%; height: 35vh; background: #000; display: flex; justify-content: center; align-items: center; position: relative; box-shadow: 0 4px 25px rgba(0,0,0,0.8); z-index: 10; }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* প্লেয়ার কন্ট্রোল বাটন (VLC/Premium Style) */
        .player-overlay-btn { position: absolute; background: rgba(20, 20, 31, 0.75); color: #fff; border: 1px solid rgba(255,255,255,0.1); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; backdrop-filter: blur(4px); transition: 0.2s; z-index: 16; }
        .player-overlay-btn:hover { background: #e50914; border-color: #e50914; box-shadow: 0 0 10px rgba(229, 9, 20, 0.5); }
        
        #pip-btn { top: 12px; right: 58px; } 
        #settings-btn { top: 12px; right: 12px; }

        /* কোয়ালিটি মেনু */
        #quality-menu { position: absolute; top: 56px; right: 12px; background: rgba(20, 20, 31, 0.95); border: 1px solid #2d2d44; border-radius: 8px; padding: 6px 0; list-style: none; display: none; z-index: 25; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(8px); min-width: 110px; }
        #quality-menu li { padding: 8px 16px; font-size: 12px; cursor: pointer; transition: 0.2s; text-align: left; font-weight: 500; color: #cbd5e1; }
        #quality-menu li:hover { background: #e50914; color: #fff; }
        #quality-menu li.active { color: #e50914; font-weight: bold; }

        /* মূল কন্টেন্ট প্যানেল */
        #content-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #0f0f15; position: relative; }
        
        /* ফিল্টার সেকশন */
        .filter-section { padding: 10px 12px; background: #14141f; border-bottom: 1px solid #222235; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        
        .filter-label { font-size: 10px; font-weight: 700; color: #e50914; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }
        .scroll-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
        .scroll-tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn { padding: 6px 12px; background: #1e1e2f; color: #cbd5e1; border: 1px solid #2d2d44; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 500; white-space: nowrap; transition: 0.2s; }
        .tab-btn.active { background: #e50914; color: white; border-color: #e50914; font-weight: bold; box-shadow: 0 3px 8px rgba(229, 9, 20, 0.3); }
        
        /* সার্চ বার */
        .search-container { position: relative; width: 100%; }
        .search-container input { width: 100%; padding: 8px 12px 8px 36px; background: #1a1a26; border: 1px solid #2d2d44; color: white; border-radius: 8px; font-size: 12px; outline: none; }
        .search-container input:focus { border-color: #e50914; }
        .search-container i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 13px; }

        /* চ্যানেল লিস্ট এরিয়া */
        #channel-list-container { flex: 1; overflow-y: auto; padding: 10px; background: #0f0f15; }
        #channel-list { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; align-content: start; }
        
        .channel-card { background: #161622; border: 1px solid #222235; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; height: 95px; transition: 0.2s; }
        .channel-card:hover { transform: translateY(-2px); background: #1d1d2f; border-color: #3b3b59; }
        .channel-card.active { border-color: #e50914; background: rgba(229, 9, 20, 0.12); }
        .channel-card img { width: 38px; height: 38px; object-fit: contain; margin-bottom: 6px; border-radius: 4px; background: #070709; border: 1px solid #252535; }
        .channel-title { font-size: 11px; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #e2e8f0; }

        @media(min-width: 768px) {
            body { flex-direction: row; }
            #main-player { width: calc(100% - 380px); height: 100vh; }
            #content-panel { width: 380px; max-width: 380px; height: 100vh; border-left: 1px solid #222235; }
            #channel-list { grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 8px; }
        }
    </style>
</head>
<body>

    <!-- ভিডিও প্লেয়ার উইন্ডো -->
    <div id="main-player">
        <video id="video-player" controls autoplay playsinline></video>
        
        <!-- PiP বাটন -->
        <button id="pip-btn" class="player-overlay-btn" title="Background Play (PiP)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="4" width="18" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
                <rect x="13" y="11" width="7" height="5" rx="1" fill="currentColor" stroke="currentColor" stroke-width="1"/>
            </svg>
        </button>
        
        <!-- গিয়ার সেটিংস বাটন -->
        <button id="settings-btn" class="player-overlay-btn" title="Video Quality"><i class="fa-solid fa-gear"></i></button>
        <ul id="quality-menu"><li class="active" onclick="changeQuality(-1, this)">Auto</li></ul>
    </div>

    <!-- ফ্রন্টএন্ড কন্টেন্ট প্যানেল (আগের মতো সুন্দর ডিজাইন) -->
    <div id="content-panel">
        <div class="filter-section">
            <!-- সার্চ বার -->
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-bar" placeholder="চ্যানেলের নাম লিখে খুঁজুন..." oninput="searchChannels()">
            </div>

            <!-- দেশ সিলেকশন -->
            <div class="filter-label"><i class="fa-solid fa-globe"></i> দেশ জোন</div>
            <div class="scroll-tabs" id="country-tabs">
                <button class="tab-btn active" onclick="changeCountry('bd', event)">🇧🇩 বাংলাদেশ + VIP</button>
                <button class="tab-btn" onclick="changeCountry('in', event)">🇮🇳 ইন্ডিয়া</button>
                <button class="tab-btn" onclick="changeCountry('us', event)">🇺🇸 USA VIP</button>
            </div>
            
            <!-- ক্যাটেগরি সিলেকশন -->
            <div class="filter-label"><i class="fa-solid fa-layer-group"></i> ক্যাটেগরি</div>
            <div class="scroll-tabs" id="category-tabs">
                <button class="cat-btn tab-btn active" onclick="changeCategory('all', event)">সব চ্যানেল</button>
                <button class="cat-btn tab-btn" style="color: #00ffaa; border-color: #00ffaa;" onclick="changeCategory('vip', event)">🏆 VIP Premium</button>
                <button class="cat-btn tab-btn" onclick="changeCategory('sports', event)">⚽ Sports</button>
                <button class="cat-btn tab-btn" onclick="changeCategory('news', event)">📰 News</button>
            </div>
        </div>

        <!-- চ্যানেল গ্রিড লিস্ট -->
        <div id="channel-list-container">
            <ul id="channel-list"></ul>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-player');
        const channelListGrid = document.getElementById('channel-list');
        const searchBar = document.getElementById('search-bar');
        const pipBtn = document.getElementById('pip-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const qualityMenu = document.getElementById('quality-menu');
        
        let fetchedChannels = [];
        let currentCountry = 'bd';
        let currentCategory = 'all';
        let hls = null;

        // আপনার দেওয়া সব নতুন ও আগের সোর্স একসাথে (VIP)
        const myVipChannels = [
            { name: "T Sports (Official 2)", logo: "https://via.placeholder.com/44/161622/e50914?text=TSports", category: "vip", url: "http://198.195.239.50:8095/tsports/tracks-v1a1/mono.m3u8" },
            { name: "Somoy TV Live", logo: "https://via.placeholder.com/44/161622/ff4a4a?text=Somoy", category: "vip", url: "https://live.thebosstv.com:30443/dwlive/Somoy-TV/chunks.m3u8" },
            { name: "Eleven Sports 1", logo: "https://via.placeholder.com/44/161622/ffffff?text=Eleven", category: "vip", url: "http://znty.dyndns.org:5010/hls/eleven1.m3u8" },
            { name: "CazéTV Live", logo: "https://via.placeholder.com/44/161622/00ffaa?text=Caze", category: "vip", url: "https://dfr80qz435crc.cloudfront.net/MNOP/Amagi/Caze/Caze_TV_BR/1080p-vtt/index.m3u8" },
            { name: "beIN SPORTS XTRA", logo: "https://via.placeholder.com/44/161622/ffffff?text=beIN", category: "vip", url: "https://bein-esp-xumo.amagi.tv/playlistR1080p.m3u8" },
            { name: "Stream 97 (CDN)", logo: "https://via.placeholder.com/44/161622/64748b?text=S97", category: "vip", url: "https://1nyaler.streamhostingcdn.top/stream/97/index.m3u8" },
            { name: "Stream 106 (CDN)", logo: "https://via.placeholder.com/44/161622/64748b?text=S106", category: "vip", url: "https://1nyaler.streamhostingcdn.top/stream/106/index.m3u8" },
            { name: "Stream 26 (CDN)", logo: "https://via.placeholder.com/44/161622/64748b?text=S26", category: "vip", url: "https://1nyaler.streamhostingcdn.top/stream/26/index.m3u8" },
            { name: "Stream 32 (CDN)", logo: "https://via.placeholder.com/44/161622/64748b?text=S32", category: "vip", url: "https://1nyaler.streamhostingcdn.top/stream/32/index.m3u8" }
        ];

        // গ্লোবাল আইপিটিভি সোর্স (হাজার হাজার লাইভ টিভির জন্য)
        const countrySources = {
            bd: "https://iptv-org.github.io/iptv/countries/bd.m3u",
            in: "https://iptv-org.github.io/iptv/countries/in.m3u",
            us: "https://iptv-org.github.io/iptv/countries/us.m3u"
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadChannels(countrySources.bd);
            
            // PiP বাটন অ্যাকশন
            pipBtn.addEventListener('click', async () => {
                try {
                    if (video !== document.pictureInPictureElement) { await video.requestPictureInPicture(); } 
                    else { await document.exitPictureInPicture(); }
                } catch (e) { alert('ভিডিও চালু করে ট্রাই করুন!'); }
            });

            // গিয়ার সেটিংস অ্যাকশন
            settingsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                qualityMenu.style.display = qualityMenu.style.display === 'block' ? 'none' : 'block';
            });
            document.addEventListener('click', () => { qualityMenu.style.display = 'none'; });
        });

        // অটোমেটিক M3U স্ক্র্যাপার ও পার্শার
        async function loadChannels(url) {
            try {
                channelListGrid.innerHTML = `<li style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;"><i class="fa-solid fa-circle-notch fa-spin fa-2xl" style="color: #e50914; margin-bottom: 15px;"></i><p>চ্যানেল লোড হচ্ছে...</p></li>`;
                
                const response = await fetch(url);
                const text = await response.text();
                
                const lines = text.split('\n');
                const parsedChannels = [];
                let current = {};

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        const nameMatch = line.match(/,(.+)$/);
                        current.name = nameMatch ? nameMatch[1] : "Live TV";
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        current.logo = logoMatch ? logoMatch[1] : "";
                        const groupMatch = line.match(/group-title="([^"]+)"/);
                        current.category = groupMatch ? groupMatch[1].toLowerCase() : "general";
                    } else if (line.startsWith('http')) {
                        current.url = line;
                        parsedChannels.push(current);
                        current = {};
                    }
                }

                // আপনার ভিআইপি চ্যানেল ও স্ক্র্যাপড চ্যানেল একসাথে মার্জ করা হচ্ছে
                fetchedChannels = (currentCountry === 'bd') ? [...myVipChannels, ...parsedChannels] : parsedChannels;
                renderGrid();
            } catch (error) {
                fetchedChannels = [...myVipChannels];
                renderGrid();
            }
        }

        // গ্রিড ভিউ রেন্ডারিং (আগের মতো স্টাইলিশ)
        function renderGrid(searchFilter = '') {
            channelListGrid.innerHTML = '';
            
            const filtered = fetchedChannels.filter(ch => {
                const matchesCategory = currentCategory === 'all' || ch.category === currentCategory || (currentCategory === 'sports' && ch.category.includes('sports')) || (currentCategory === 'news' && ch.category.includes('news'));
                const matchesSearch = ch.name.toLowerCase().includes(searchFilter.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                channelListGrid.innerHTML = `<li style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">কোনো চ্যানেল পাওয়া যায়নি।</li>`;
                return;
            }

            filtered.forEach(ch => {
                const card = document.createElement('li');
                card.className = 'channel-card';
                if(ch.category === 'vip') card.style.borderColor = '#00ffaa';
                
                const logoImg = ch.logo ? ch.logo : "https://via.placeholder.com/44/161622/ffffff?text=📺";
                card.innerHTML = `<img src="${logoImg}" onerror="this.src='https://via.placeholder.com/44/161622/e50914?text=TV'"><span class="channel-title">${ch.name}</span>`;
                
                card.addEventListener('click', () => {
                    document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
                    card.classList.add('active');
                    playVlcCore(ch.url);
                });
                
                channelListGrid.appendChild(card);
            });
        }

        // VLC-এর মতো শক্তিশালী ব্যাকগ্রাউন্ড স্ট্রিমিং কোর 엔진
        function playVlcCore(streamUrl) {
            if (hls) { hls.destroy(); hls = null; }
            video.src = "";
            qualityMenu.innerHTML = `<li class="active" onclick="changeQuality(-1, this)">Auto</li>`;

            // VLC ইঞ্জিনের মতো হাই-পারফরম্যান্স লো-ল্যাটেন্সি কনফিগারেশন
            const vlcConfig = {
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                enableWorker: true,
                lowLatencyMode: true,
                xhrSetup: function(xhr, url) { xhr.withCredentials = false; } // CORS বাইপাস করার চেষ্টা
            };

            if (Hls.isSupported()) {
                hls = new Hls(vlcConfig);
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    const levels = hls.levels;
                    levels.forEach((level, index) => {
                        const name = level.height ? level.height + 'p' : 'Quality ' + index;
                        const li = document.createElement('li');
                        li.textContent = name;
                        li.onclick = function() { changeQuality(index, li); };
                        qualityMenu.appendChild(li);
                    });
                    video.play().catch(() => {});
                });

                // কোনো এরর বা বাফারিং হলে VLC-এর মতো অটো-রিকভারি করবে
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { hls.startLoad(); } 
                        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => { video.play(); });
            }
        }

        function changeQuality(levelIndex, element) {
            if (hls) {
                hls.currentLevel = levelIndex;
                document.querySelectorAll('#quality-menu li').forEach(li => li.classList.remove('active'));
                element.classList.add('active');
            }
        }

        function searchChannels() { renderGrid(searchBar.value); }

        function changeCountry(code, event) {
            document.querySelectorAll('#country-tabs .tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            currentCountry = code;
            currentCategory = 'all';
            document.querySelectorAll('#category-tabs .cat-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('#category-tabs .cat-btn')[0].classList.add('active');
            loadChannels(countrySources[code]);
        }

        function changeCategory(cat, event) {
            document.querySelectorAll('#category-tabs .cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            currentCategory = cat;
            renderGrid(searchBar.value);
        }
    </script>
</body>
</html>
