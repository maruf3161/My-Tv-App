        @keyframes pulse {

            50% { transform: scale(1.08); opacity: 1; }

        #custom-controls { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(transparent, rgba(10, 10, 15, 0.95)); padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }

        .time-display { font-size: 12px; font-weight: 500; color: #cbd5e1; font-family: monospace; }

        window.addEventListener('DOMContentLoaded', () => {
            renderGrid();
            setupControls();
            
            pipBtn.addEventListener('click', () => {
                const playerDiv = document.getElementById('main-player');
                if (playerDiv.style.position === 'fixed') {
                    playerDiv.style.position = 'relative';
                    playerDiv.style.width = '100%';
                    playerDiv.style.height = '35vh';
                } else {
                    playerDiv.style.position = 'fixed';
                    playerDiv.style.width = '180px';
                    playerDiv.style.height = '110px';
                    playerDiv.style.bottom = '20px';
                    playerDiv.style.right = '15px';
                }
            });
        });

        function setupControls() {
            playPauseBtn.addEventListener('click', () => {
                if (video.paused) video.play();
                else video.pause();
            });
            video.addEventListener('play', () => { playPauseIcon.className = 'fa-solid fa-pause'; });
            video.addEventListener('pause', () => { playPauseIcon.className = 'fa-solid fa-play'; });
            
            video.addEventListener('timeupdate', () => {
                const current = video.currentTime;
                const mins = Math.floor(current / 60);
                const secs = Math.floor(current % 60);
                timeDisplay.textContent = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs} / LIVE`;
            });
        }

        function renderGrid(searchFilter = '') {
            channelListGrid.innerHTML = '';
            const filtered = vipChannels.filter(ch => {
                const matchesCategory = currentCategory === 'all' || ch.category === currentCategory;
                const matchesSearch = ch.name.toLowerCase().includes(searchFilter.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            filtered.forEach(ch => {
                const card = document.createElement('li');
                card.className = 'channel-card';
                card.innerHTML = `<img src="${ch.logo}"><span class="channel-title">${ch.name}</span>`;
                
                card.addEventListener('click', () => {
                    document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
                    card.classList.add('active');
                    poster.style.display = 'none';
                    playStream(ch.url);
                });
                channelListGrid.appendChild(card);
            });
        }

        function playStream(streamUrl) {
            if (hls) { hls.destroy(); hls = null; }
            video.src = "";

            if (Hls.isSupported()) {
                hls = new Hls({ maxBufferLength: 10, lowLatencyMode: true });
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
                
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => { video.play(); });
            }
        }

        function searchChannels() { renderGrid(searchBar.value); }

        function changeCategory(cat, event) {
            document.querySelectorAll('#category-tabs .cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            currentCategory = cat;
            renderGrid(searchBar.value);
        }
    </script>
