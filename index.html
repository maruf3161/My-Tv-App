<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Universal IPTV Pro - Hybrid Streamer</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #video-container { width: 100%; height: 50vh; background: #111; }
        video { width: 100%; height: 100%; }
        #list-container { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-btn { background: #222; border: 1px solid #444; padding: 15px; margin: 5px 0; cursor: pointer; color: #fff; width: 100%; text-align: left; border-radius: 5px; }
        .channel-btn:hover { background: #e50914; }
    </style>
</head>
<body>

<div id="video-container">
    <video id="video" controls autoplay playsinline></video>
</div>

<div id="list-container">
    <h3 style="color:#e50914">📜 সকল চ্যানেল প্লেলিস্ট</h3>
    <div id="channel-list"></div>
</div>

<script>
    const video = document.getElementById('video');
    const channelList = document.getElementById('channel-list');

    // আজকের ও আগের সব লিংক একসাথে
    const myChannels = [
        { name: "T Sports (Official 2)", url: "http://198.195.239.50:8095/tsports/tracks-v1a1/mono.m3u8" },
        { name: "Somoy TV Live", url: "https://live.thebosstv.com:30443/dwlive/Somoy-TV/chunks.m3u8" },
        { name: "Eleven Sports 1", url: "http://znty.dyndns.org:5010/hls/eleven1.m3u8" },
        { name: "CazéTV Live", url: "https://dfr80qz435crc.cloudfront.net/MNOP/Amagi/Caze/Caze_TV_BR/1080p-vtt/index.m3u8" },
        { name: "beIN SPORTS XTRA", url: "https://bein-esp-xumo.amagi.tv/playlistR1080p.m3u8" },
        { name: "Stream 97 (CDN)", url: "https://1nyaler.streamhostingcdn.top/stream/97/index.m3u8" },
        { name: "Stream 106 (CDN)", url: "https://1nyaler.streamhostingcdn.top/stream/106/index.m3u8" },
        { name: "Stream 26 (CDN)", url: "https://1nyaler.streamhostingcdn.top/stream/26/index.m3u8" },
        { name: "Stream 32 (CDN)", url: "https://1nyaler.streamhostingcdn.top/stream/32/index.m3u8" }
    ];

    function playStream(url) {
        if (Hls.isSupported()) {
            const hls = new Hls({
                xhrSetup: function(xhr, url) { xhr.withCredentials = false; },
                debug: false
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
    }

    myChannels.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'channel-btn';
        btn.innerText = "▶ " + ch.name;
        btn.onclick = () => playStream(ch.url);
        channelList.appendChild(btn);
    });
</script>
</body>
</html>
