<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP IPTV Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #0a0a0f; color: #f8fafc; overflow: hidden; }
        
        /* প্রিমিয়াম প্লেয়ার কন্টেইনার */
        #main-player { width: 100%; height: 35vh; background: #000; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; border-bottom: 2px solid #1e1e2f; box-shadow: 0 4px 30px rgba(0,0,0,0.9); z-index: 999; transition: all 0.3s ease; }
        video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }

        /* ভিডিও না থাকলে সুন্দর পোস্টার স্ক্রিন */
        #player-poster { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #11111b 0%, #070709 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 15; text-align: center; padding: 20px; }
        #player-poster i { font-size: 40px; color: #e50914; margin-bottom: 12px; text-shadow: 0 0 15px rgba(229, 9, 20, 0.6); animation: pulse 2s infinite; }
        #player-poster p { font-size: 14px; font-weight: 600; color: #94a3b8; letter-spacing: 0.5px; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* প্রিমিয়াম টপ কন্ট্রোল বাটন */
        .player-overlay-btn { position: absolute; background: rgba(15, 15, 25, 0.85); color: #fff; border: 1px solid rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; backdrop-filter: blur(8px); transition: 0.2s; z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .player-overlay-btn:hover { background: #e50914; border-color: #e50914; box-shadow: 0 0 15px rgba(229, 9, 20, 0.6); transform: scale(1.05); }
        
        #pip-btn { top: 15px; right: 60px; } 
        #settings-btn { top: 15px; right: 15px; }

        /* কাস্টম লোয়ার কন্ট্রোল বার (টাইমলাইন ও পজ বাটন) */
        #custom-controls { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(transparent, rgba(10, 10, 15, 0.95)); padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; z-index: 20; opacity: 1; transition: opacity 0.3s; }
        
        .controls-row { display: flex; align-items: center; justify-content: space-between; width: 100%; color: #fff; }
        .controls-left { display: flex; align-items: center; gap: 15px; }
        
        #play-pause-btn { background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; transition: 0.2s; width: 25px; }
        #play-pause-btn:hover { color: #e50914; transform: scale(1.1); }
        
        .time-display { font-size: 12px; font-weight: 500; color: #cbd5e1; font-family: monospace; }
        
        /* কাস্টম প্রিমিয়াম টাইমলাইন প্রোগ্রেস বার */
        .progress-container { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; position: relative; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #e50914, #ff333f); border-radius: 2px; position: relative; box-shadow: 0 0 8px rgba(229,9,20,0.5); }

        /* কোয়ালিটি সেটিংস মেনু */
        #quality-menu { position: absolute; top: 60px; right: 15px; background: rgba(15, 15, 25, 0.95); border: 1px solid #2d2d44; border-radius: 10px; padding: 8px 0; list-style: none; display: none; z-index: 25; box-shadow: 0 10px 25px rgba(0,0,0,0.6); backdrop-filter: blur(10px); min-width: 120px; }
        #quality-menu li { padding: 10px 18px; font-size: 13px; cursor: pointer; transition: 0.2s; text-align: left; font-weight: 500; color: #cbd5e1; }
        #quality-menu li:hover { background: #e50914; color: #fff; }

        /* কন্টেন্ট হাব */
        #content-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #0d0d14; }
        
        /* আধুনিক গ্লোয়িং ফিল্টার প্যানেল */
        .filter-section { padding: 14px; background: #12121f; border-bottom: 1px solid #1e1e2f; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .filter-label { font-size: 11px; font-weight: 700; color: #e50914; text-transform: uppercase; letter-spacing: 1.5px; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
        
        .scroll-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .scroll-tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn { padding: 8px 16px; background: #1a1a2e; color: #94a3b8; border: 1px solid #27273f; border-radius: 25px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .tab-btn:hover { background: #22223b; color: #f1f5f9; border-color: #3b3b5c; }
        .tab-btn.active { background: linear-gradient(90deg, #e50914, #ff333f); color: white; border-color: #e50914; font-weight: bold; box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4); }
        
        .search-container { position: relative; width: 100%; }
        .search-container input { width: 100%; padding: 10px 14px 10px 42px; background: #181826; border: 1px solid #27273f; color: white; border-radius: 30px; font-size: 13px; outline: none; transition: 0.2s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .search-container input:focus { border-color: #e50914; box-shadow: 0 0 10px rgba(229, 9, 20, 0.2); }
        .search-container i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 14px; }

        /* চ্যানেল গ্রিড ভিউ */
        #channel-list-container { flex: 1; overflow-y: auto; padding: 12px; background: #0a0a0f; }
        #channel-list { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; align-content: start; }
        
        .channel-card { background: linear-gradient(145deg, #131322, #0f0f1a); border: 1px solid #1e1e2f; border-radius: 12px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; height: 100px; transition: all 0.25s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .channel-card:hover { transform: translateY(-4px); background: #19192e; border-color: #3b3b5c; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        .channel-card.active { border-color: #e50914; background: rgba(229, 9, 20, 0.15); box-shadow: 0 0 12px rgba(229, 9, 20, 0.3); }
        
        .channel-card img { width: 42px; height: 42px; object-fit: contain; margin-bottom: 8px; border-radius: 8px; background: #06060a; padding: 3px; border: 1px solid #222235; }
        .channel-title { font-size: 11px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #cbd5e1; }

        @media(min-width: 768px) {
            body { flex-direction: row; }
            #main-player { width: calc(100% - 390px); height: 100vh; border-bottom: none; border-right: 2px solid #1e1e2f; }
            #content-panel { width: 390px; max-width: 390px; height: 100vh; }
        }
    </style>
</head>
<body>

    <div id="main-player">
        <div id="player-poster">
            <i class="fa-solid fa-play-circle"></i>
            <p>VIP IPTV PRO</p>
            <span style="font-size: 11px; color: #64748b; margin-top: 5px;">চালু করতে নিচে যেকোনো চ্যানেলে ক্লিক করো</span>
        </div>

        <video id="video-player" autoplay playsinline></video>
        
        <button id="pip-btn" class="player-overlay-btn" title="Background Play"><i class="fa-solid fa-clone"></i></button>
        <button id="settings-btn" class="player-overlay-btn" title="Quality"><i class="fa-solid fa-gear"></i></button>
        <ul id="quality-menu"><li class="active" onclick="changeQuality(-1, this)">Auto</li></ul>

        <div id="custom-controls">
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="controls-row">
                <div class="controls-left">
                    <button id="play-pause-btn"><i class="fa-solid fa-pause"></i></button>
                    <div class="time-display" id="time-display">00:00 / 00:00</div>
                </div>
                <div style="font-size: 11px; color: #e50914; font-weight: bold; letter-spacing: 1px;"><i class="fa-solid fa-circle fa-xs" style="margin-right: 4px; animation: pulse 1s infinite;"></i>LIVE STREAM</div>
            </div>
        </div>
    </div>

    <div id="content-panel">
        <div class="filter-section">
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-bar" placeholder="চ্যানেলের নাম লিখে সার্চ করো..." oninput="searchChannels()">
            </div>

            <div class="filter-label"><i class="fa-solid fa-globe"></i> দেশ জোন</div>
            <div class="scroll-tabs" id="country-tabs">
                <button class="tab-btn active" onclick="changeCountry('bd', event)">🇧🇩 বাংলাদেশ VIP</button>
                <button class="tab-btn" onclick="changeCountry('in', event)">🇮🇳 ইন্ডিয়া জোন</button>
                <button class="tab-btn" onclick="changeCountry('us', event)">🇺🇸 USA Premium</button>
            </div>
            
            <div class="filter-label"><i class="fa-solid fa-layer-group"></i> ক্যাটেগরি ক্যাশ</div>
            <div class="scroll-tabs" id="category-tabs">
                <button class="cat-btn tab-btn active" onclick="changeCategory('all', event)">সব চ্যানেল</button>
                <button class="cat-btn tab-btn" style="color: #00ffaa; border-color: rgba(0,255,170,0.3);" onclick="changeCategory('vip', event)">🏆 VIP Premium</button>
                <button class="cat-btn tab-btn" onclick="changeCategory('sports', event)">⚽ Sports</button>
                <button class="cat-btn tab-btn" onclick="changeCategory('news', event)">📰 News</button>
            </div>
        </div>

        <div id="channel-list-container">
            <ul id="channel-list"></ul>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-player');
        const poster = document.getElementById('player-poster');
        const channelListGrid = document.getElementById('channel-list');
        const searchBar = document.getElementById('search-bar');
        const pipBtn = document.getElementById('pip-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const qualityMenu = document.getElementById('quality-menu');
        
        // কাস্টম কন্ট্রোল অবজেক্টসমূহ
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playPauseIcon = playPauseBtn.querySelector('i');
        const timeDisplay = document.getElementById('time-display');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        
        let fetchedChannels = [];
        let currentCountry = 'bd';
        let currentCategory = 'all';
        let hls = null;

        // সুপারফাস্ট রানিং হাই-স্পিড VIP চ্যানেল কালেকশন (সবগুলো টেস্ট করা ওয়ার্কিং লিংক)
        const myVipChannels = [
            { name: "T Sports Live HD", logo: "https://via.placeholder.com/44/131322/e50914?text=TSports", category: "vip", url: "http://198.195.239.50:8095/tsports/tracks-v1a1/mono.m3u8" },
            { name: "Somoy TV Live 24/7", logo: "https://via.placeholder.com/44/131322/ff4a4a?text=Somoy", category: "vip", url: "https://live.thebosstv.com:30443/dwlive/Somoy-TV/chunks.m3u8" },
            { name: "Jamuna TV Premium", logo: "https://via.placeholder.com/44/131322/f59e0b?text=Jamuna", category: "vip", url: "https://bdiptv.stream/jamuna/index.m3u8" },
            { name: "Independent TV Live", logo: "https://via.placeholder.com/44/131322/3b82f6?text=Indep", category: "vip", url: "https://bdiptv.stream/independent/index.m3u8" },
            { name: "CazéTV Sports 1", logo: "https://via.placeholder.com/44/131322/00ffaa?text=Caze", category: "vip", url: "https://dfr80qz435crc.cloudfront.net/MNOP/Amagi/Caze/Caze_TV_BR/1080p-vtt/index.m3u8" },
            { name: "beIN SPORTS XTRA Premium", logo: "https://via.placeholder.com/44/131322/ffffff?text=beIN", category: "vip", url: "https://bein-esp-xumo.amagi.tv/playlistR1080p.m3u8" }
        ];

        const countrySources = {
            bd: "https://iptv-org.github.io/iptv/countries/bd.m3u",
            in: "https://iptv-org.github.io/iptv/countries/in.m3u",
            us: "https://iptv-org.github.io/iptv/countries/us.m3u"
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadChannels(countrySources.bd);
            setupCustomControls();
            
            // ইন-অ্যাপ রেসপন্সিভ PiP ইঞ্জিন টগল লজিক
            pipBtn.addEventListener('click', () => {
                const playerDiv = document.getElementById('main-player');
                if (playerDiv.style.position === 'fixed') {
                    playerDiv.style.position = 'relative';
                    playerDiv.style.width = '100%';
                    playerDiv.style.height = '35vh';
                } else {
                    playerDiv.style.position = 'fixed';
                    playerDiv.style.width = '180px';
                    playerDiv.style.height = '110px';
                    playerDiv.style.bottom = '20px';
                    playerDiv.style.right = '15px';
                }
            });

            settingsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                qualityMenu.style.display = qualityMenu.style.display === 'block' ? 'none' : 'block';
            });
            document.addEventListener('click', () => { qualityMenu.style.display = 'none'; });
        });

        // কাস্টম প্রিমিয়াম কন্ট্রোল মেকানিজম (প্লে, পজ, প্রোগ্রেস বার ও টাইম ট্র্যাকিং)
        function setupCustomControls() {
            playPauseBtn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.focus();
                    video.pause();
                }
            });

            video.addEventListener('play', () => { playPauseIcon.className = 'fa-solid fa-pause'; });
            video.addEventListener('pause', () => { playPauseIcon.className = 'fa-solid fa-play'; });

            // টাইমলাইন ও সময় আপডেট ট্র্যাকিং
            video.addEventListener('timeupdate', () => {
                const current = video.currentTime;
                const total = video.duration || 0;
                
                // প্রোগ্রেস বার লাল অংশ বাড়ানো
                if (total > 0) {
                    const percentage = (current / total) * 100;
                    progressBar.style.width = percentage + '%';
                } else {
                    progressBar.style.width = '100%'; // লাইভ স্ট্রিমের জন্য ফুল টাইমলাইন গ্লো
                }
                
                timeDisplay.textContent = formatTime(current) + ' / ' + formatTime(total);
            });

            // টাইমলাইনে হাত দিয়ে টানলে যেন ভিডিওর সময় বাড়ে/কমে
            progressContainer.addEventListener('click', (e) => {
                const total = video.duration || 0;
                if (total > 0) {
                    const rect = progressContainer.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const width = rect.width;
                    video.currentTime = (clickX / width) * total;
                }
            });
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return "00:00";
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            if (hrs > 0) {
                return `${hrs}:${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        async function loadChannels(url) {
            try {
                channelListGrid.innerHTML = `<li style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;"><i class="fa-solid fa-circle-notch fa-spin fa-2xl" style="color: #e50914; margin-bottom: 15px;"></i><p>চ্যানেল ম্যাপিং হচ্ছে...</p></li>`;
                const response = await fetch(url);
                const text = await response.text();
                const lines = text.split('\n');
                const parsedChannels = [];
                let current = {};

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        const nameMatch = line.match(/,(.+)$/);
                        current.name = nameMatch ? nameMatch[1] : "Live TV";
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        current.logo = logoMatch ? logoMatch[1] : "";
                        const groupMatch = line.match(/group-title="([^"]+)"/);
                        current.category = groupMatch ? groupMatch[1].toLowerCase() : "general";
                    } else if (line.startsWith('http')) {
                        current.url = line;
                        parsedChannels.push(current);
                        current = {};
                    }
                }
                // শুধুমাত্র বাংলাদেশ ক্যাটাগরিতে আমাদের নিজস্ব ভেরিফাইড VIP লিংকগুলো একদম টপে শো করবে
                fetchedChannels = (currentCountry === 'bd') ? [...myVipChannels, ...parsedChannels] : parsedChannels;
                renderGrid();
            } catch (error) {
                fetchedChannels = [...myVipChannels];
                renderGrid();
            }
        }

        function renderGrid(searchFilter = '') {
            channelListGrid.innerHTML = '';
            const filtered = fetchedChannels.filter(ch => {
                const matchesCategory = currentCategory === 'all' || ch.category === currentCategory || (currentCategory === 'sports' && ch.category.includes('sports')) || (currentCategory === 'news' && ch.category.includes('news'));
                const matchesSearch = ch.name.toLowerCase().includes(searchFilter.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                channelListGrid.innerHTML = `<li style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">কোনো সচল চ্যানেল পাওয়া যায়নি।</li>`;
                return;
            }

            filtered.forEach(ch => {
                const card = document.createElement('li');
                card.className = 'channel-card';
                if(ch.category === 'vip') card.style.borderColor = 'rgba(0,255,170,0.4)';
                
                const logoImg = ch.logo ? ch.logo : "https://via.placeholder.com/44/131322/ffffff?text=📺";
                card.innerHTML = `<img src="${logoImg}" onerror="this.src='https://via.placeholder.com/44/131322/e50914?text=TV'"><span class="channel-title">${ch.name}</span>`;
                
                card.addEventListener('click', () => {
                    document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
                    card.classList.add('active');
                    
                    poster.style.display = 'none';
                    playStream(ch.url);
                });
                channelListGrid.appendChild(card);
            });
        }

        function playStream(streamUrl) {
            if (hls) { hls.destroy(); hls = null; }
            video.src = "";
            qualityMenu.innerHTML = `<li class="active" onclick="changeQuality(-1, this)">Auto</li>`;

            if (Hls.isSupported()) {
                hls = new Hls({ maxBufferLength: 30, lowLatencyMode: true });
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    hls.levels.forEach((level, index) => {
                        const name = level.height ? level.height + 'p' : 'Quality ' + index;
                        const li = document.createElement('li');
                        li.textContent = name;
                        li.onclick = function() { changeQuality(index, li); };
                        qualityMenu.appendChild(li);
                    });
                    video.play().catch(() => {});
                });

                // ওটো-রিকভারি (লিংক এরর আসলে পেজ না আটকে স্ট্রিম অটো রিলোড করবে)
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { hls.startLoad(); } 
                        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => { video.play(); });
            }
        }

        function changeQuality(levelIndex, element) {
            if (hls) {
                hls.currentLevel = levelIndex;
                document.querySelectorAll('#quality-menu li').forEach(li => li.classList.remove('active'));
                element.classList.add('active');
            }
        }

        function searchChannels() { renderGrid(searchBar.value); }

        function changeCountry(code, event) {
            document.querySelectorAll('#country-tabs .tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            currentCountry = code;
            currentCategory = 'all';
            document.querySelectorAll('#category-tabs .cat-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('#category-tabs .cat-btn')[0].classList.add('active');
            loadChannels(countrySources[code]);
        }

        function changeCategory(cat, event) {
            document.querySelectorAll('#category-tabs .cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            currentCategory = cat;
            renderGrid(searchBar.value);
        }
    </script>
</body>
</html>
