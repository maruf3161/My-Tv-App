<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; height: 100vh; background: #121212; color: white; }
        
        /* Sidebar layout */
        #sidebar { width: 300px; background: #1f1f1f; display: flex; flex-direction: column; border-right: 1px solid #333; }
        #controls { padding: 15px; border-bottom: 1px solid #333; }
        #playlist-url { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: none; background: #333; color: white; }
        #load-btn { width: 100%; padding: 8px; background: #e50914; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #channel-list { flex: 1; overflow-y: auto; list-style: none; }
        
        .channel-item { display: flex; align-items: center; padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #2d2d2d; transition: 0.2s; }
        .channel-item:hover { background: #333; }
        .channel-item img { width: 40px; height: 40px; object-fit: contain; margin-right: 12px; border-radius: 4px; background: #000; }
        
        /* Main Player Window */
        #main-player { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        video { width: 100%; height: 100%; max-height: 100vh; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="controls">
            <input type="text" id="playlist-url" placeholder="Paste M3U URL here..." value="https://iptv-org.github.io/iptv/categories/news.m3u">
            <button id="load-btn">Load Playlist</button>
        </div>
        <ul id="channel-list">
            </ul>
    </div>

    <div id="main-player">
        <video id="video-player" controls autoplay></video>
    </div>

    <script>
        const video = document.getElementById('video-player');
        const loadBtn = document.getElementById('load-btn');
        const playlistUrlInput = document.getElementById('playlist-url');
        const channelList = document.getElementById('channel-list');
        let hls = null;

        loadBtn.addEventListener('click', () => {
            const url = playlistUrlInput.value.trim();
            if (url) fetchAndParseM3U(url);
        });

        // 1. Fetch and Parse M3U logic
        async function fetchAndParseM3U(url) {
            try {
                channelList.innerHTML = "<li style='padding:15px;'>Loading channels...</li>";
                const response = await fetch(url);
                if (!response.ok) throw new Error("Failed to fetch playlist");
                const text = await response.text();
                
                const channels = parseM3U(text);
                renderChannels(channels);
            } catch (error) {
                channelList.innerHTML = `<li style='padding:15px; color:red;'>Error: ${error.message}. Note: Check CORS restrictions.</li>`;
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    // Extract Name
                    const nameMatch = line.match(/,(.+)$/);
                    currentChannel.name = nameMatch ? nameMatch[1] : "Unknown Channel";
                    
                    // Extract Logo URL
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    currentChannel.logo = logoMatch ? logoMatch[1] : "https://via.placeholder.com/40?text=TV";
                } else if (line.startsWith('http')) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = {}; // Reset for the next one
                }
            }
            return channels;
        }

        // 2. Render UI List
        function renderChannels(channels) {
            channelList.innerHTML = ''; // Clear loading text
            
            if (channels.length === 0) {
                channelList.innerHTML = "<li style='padding:15px;'>No channels found.</li>";
                return;
            }

            channels.forEach(channel => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                li.innerHTML = `
                    <img src="${channel.logo}" onerror="this.src='https://via.placeholder.com/40?text=TV'">
                    <span>${channel.name}</span>
                `;
                li.addEventListener('click', () => playStream(channel.url));
                channelList.appendChild(li);
            });
        }

        // 3. Play HLS Stream (.m3u8)
        function playStream(streamUrl) {
            if (hls) {
                hls.destroy(); // Destroy previous instance if switching channels
            }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                });
            } 
            // Fallback for native HLS browsers (like Safari)
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                });
            } else {
                alert('Your browser does not support HLS streaming.');
            }
        }
    </script>
</body>
</html>
